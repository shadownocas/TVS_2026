report:
  - bug:
      type: Null Dereference
      lineno: 76
      class: tp
      description: |
        Found by Infer. In hashmap_new(), map is allocated with malloc at line 61 but the return value is not checked.
         If malloc returns NULL, map is dereferenced at line 76.
      recommendation: |
        Check whether map is NULL after malloc and return NULL before dereferencing it.

  - bug:
      type: Null Dereference
      lineno: 72
      class: tp
      description: |
        Found by clang-analyzer. If the allocation of fields fails, the code frees map but continues execution.
         Then fields is still NULL and field->size is dereferenced inside the for loop.
      recommendation: |
        Return NULL immediately after freeing map when fields allocation fails.

  - bug:
      type: Memory Leak
      lineno: 130
      class: tp
      description: |
        Found by Infer. In hashmap_set(), a new entries array is allocated at line 118. 
        The previous field->entries pointer is overwritten at line 127 without being freed, leaking the old entries array.
      recommendation: |
        Use realloc or free the old field->entries array after copying its contents and before
        field->entries = entries.

  - bug:
      type: Incorrect malloc size
      lineno: 124
      class: tp
      description: |
        Found by clang-analyzer. entry->key is allocated with malloc(sizeof(key)),
         but key is a char pointer. This allocates the size of the pointer(8 bytes) instead 
         of the length of the string, which can cause a heap buffer overflow when strcpy copies the key.
      recommendation: |
        Allocate strlen(key) + 1 bytes for the key string instead of malloc(sizeof(key)).

  - bug:
      type: Insecure API Usage
      lineno: 125
      class: tp
      description: |
        Found by clang-analyzer with security.insecureAPI.strcpy. The code uses strcpy,
         which performs an unbounded string copy. Together with the wrong allocation size
         at line 124(previous bug),this can overflow entry->key.
      recommendation: |
        Allocate the correct buffer size and use a bounded/correct copy such 
        as memcpy(entry->key, key, strlen(key) + 1).

  - bug:
      type: Null Dereference
      lineno: 156
      class: tp
      description: |
        Found by Infer. In hashmap_get(), val is allocated with malloc at line 155 
        and is passed to memcpy without checking whether malloc returned NULL.
      recommendation: |
        Check whether val is NULL before calling memcpy.

  - bug:
      type: Memory Leak
      lineno: 170
      class: tp
      description: |
        Found by clang-analyzer. hashmap_get() returns dynamically allocated memory, 
        stored in ret, but ret is never freed in main.
      recommendation: |
        Call free(ret) after the assertion and before freeing the hashmap.

  - bug:
      type: Memory Leak
      lineno: 156
      class: fp
      description: |
        Found by Infer. I believe Infer sees malloc() inside hashmap_get() with no
        matching free() in the same function, and reports a leak. This is
        a false positive:Infer only analyzes hashmap_get() in isolation
        and cannot see that the pointer leaves the function via return,
        landing in ret inside main(). The real leak
        is in main(), where ret is never freed (bug 7)
        
      recommendation: |
        Document that the caller owns the returned pointer and must free it.